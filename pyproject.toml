[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roto-kb"
version = "0.1.0"
description = "Independent ROTO engineering knowledge RAG service"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2.0", "httpx>=0.24", "uvicorn>=0.23", "qdrant-client>=1.19", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
roto-kb = "roto_kb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
