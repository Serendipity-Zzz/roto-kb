# ROTO-KB public TLS front door.
# Keep port 80 / legacy kb-server root path unchanged.
# Temporary self-signed IP-SAN cert is allowed only for curl -k acceptance.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 54.172.101.190;

    ssl_certificate     /etc/roto-kb/tls/fullchain.pem;
    ssl_certificate_key /etc/roto-kb/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 8m;

    location = /roto-kb {
        return 301 /roto-kb/;
    }

    location /roto-kb/ {
        proxy_pass http://127.0.0.1:8710/roto-kb/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        limit_except GET POST HEAD OPTIONS {
            deny all;
        }
    }
}
